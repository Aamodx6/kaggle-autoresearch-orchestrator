[project]
name = "orch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aamodx6", email = "aamodkumar2006@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "kaggle>=1.6.0",
    "lightgbm>=4.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.4.0",
    "tabulate>=0.9.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
orch = "orch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

